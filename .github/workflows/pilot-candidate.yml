name: Build signed pilot candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    secrets:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
  candidate:
    needs: quality
    runs-on: ubuntu-24.04
    environment: pilot
    timeout-minutes: 30
    env:
      DHWINRIDE_RELEASE_STORE_PASSWORD: ${{ secrets.DHWINRIDE_RELEASE_STORE_PASSWORD }}
      DHWINRIDE_RELEASE_KEY_ALIAS: ${{ secrets.DHWINRIDE_RELEASE_KEY_ALIAS }}
      DHWINRIDE_RELEASE_KEY_PASSWORD: ${{ secrets.DHWINRIDE_RELEASE_KEY_PASSWORD }}
      SUPABASE_URL: ${{ vars.PILOT_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PILOT_SUPABASE_PUBLISHABLE_KEY }}
      MAPBOX_PUBLIC_TOKEN: ${{ secrets.PILOT_MAPBOX_PUBLIC_TOKEN }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      PILOT_RELEASE_CERT_SHA256: ${{ vars.PILOT_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Load secure candidate configuration
        env:
          KEYSTORE_B64: ${{ secrets.DHWINRIDE_RELEASE_KEYSTORE_B64 }}
          PASSENGER_FIREBASE_B64: ${{ secrets.PASSENGER_GOOGLE_SERVICES_B64 }}
          RIDER_FIREBASE_B64: ${{ secrets.RIDER_GOOGLE_SERVICES_B64 }}
          PILOT_OWNER_CONFIG_JSON: ${{ vars.PILOT_OWNER_CONFIG_JSON }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          def secret(name):
              value = os.environ.get(name, '')
              if not value:
                  raise SystemExit('Missing secure configuration: ' + name)
              return value
          keystore = Path(os.environ['RUNNER_TEMP']) / 'pilot-release.jks'
          keystore.write_bytes(base64.b64decode(secret('KEYSTORE_B64'), validate=True))
          keystore.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('DHWINRIDE_RELEASE_KEYSTORE_PATH=' + str(keystore) + '\n')
          for variable, module, app_id in [
              ('PASSENGER_FIREBASE_B64', 'passenger-app', 'zm.co.dhwinride.passenger'),
              ('RIDER_FIREBASE_B64', 'rider-app', 'zm.co.dhwinride.rider'),
          ]:
              payload = base64.b64decode(secret(variable), validate=True)
              config = json.loads(payload)
              packages = [item.get('client_info', {}).get('android_client_info', {}).get('package_name') for item in config.get('client', [])]
              if app_id not in packages:
                  raise SystemExit('Firebase app does not match ' + module)
              target = Path(module) / 'google-services.json'
              target.write_bytes(payload)
              target.chmod(0o600)
          owner = json.loads(secret('PILOT_OWNER_CONFIG_JSON'))
          Path('.pilot').mkdir(exist_ok=True)
          Path('.pilot/owner.json').write_text(json.dumps(owner))
          PY
      - run: python3 scripts/pilot-preflight.py --owner-config .pilot/owner.json --configuration-only
      - name: Record candidate build timestamp
        run: echo "PILOT_BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Build and lint signed release candidates
        run: bash gradlew :passenger-app:assembleRelease :rider-app:assembleRelease :passenger-app:lintRelease :rider-app:lintRelease --no-daemon --max-workers=2
      - name: Verify candidate identity and record artifact evidence
        run: |
          set -euo pipefail
          mkdir -p pilot-candidate
          python3 scripts/verify-android-candidates.py \
            --passenger-apk passenger-app/build/outputs/apk/release/passenger-app-release.apk \
            --rider-apk rider-app/build/outputs/apk/release/rider-app-release.apk \
            --passenger-mapping passenger-app/build/outputs/mapping/release/mapping.txt \
            --rider-mapping rider-app/build/outputs/mapping/release/mapping.txt \
            --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2" \
            --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner" \
            --expected-cert-sha256 "$PILOT_RELEASE_CERT_SHA256" \
            --expected-version-code 1 \
            --expected-version-name 0.1.0 \
            --source-commit "$(git rev-parse HEAD)" \
            --output pilot-candidate/verification.json
          python3 scripts/write-android-release-manifest.py \
            --verification pilot-candidate/verification.json \
            --build-timestamp "$PILOT_BUILD_TIMESTAMP" \
            --output pilot-candidate/ANDROID_RELEASE_MANIFEST.md
          cp passenger-app/build/outputs/apk/release/passenger-app-release.apk pilot-candidate/
          cp rider-app/build/outputs/apk/release/rider-app-release.apk pilot-candidate/
          sha256sum pilot-candidate/*.apk > pilot-candidate/SHA256SUMS
          git rev-parse HEAD > pilot-candidate/SOURCE_COMMIT
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-pilot-candidate
          path: pilot-candidate/
          retention-days: 7
      - name: Remove temporary signing and configuration files
        if: always()
        run: rm -f "$RUNNER_TEMP/pilot-release.jks" passenger-app/google-services.json rider-app/google-services.json .pilot/owner.json
